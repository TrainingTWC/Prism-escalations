<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prism Escalations</title>
  <script>
    // SPA routing fallback for GitHub Pages with custom domain (escalations.prismintelligence.in).
    // When GitHub Pages returns 404 for a deep link, save the intended path to
    // sessionStorage, redirect to root, and let the root layout restore it.
    (function () {
      var route = window.location.pathname;
      if (!route || route === '/') return;
      sessionStorage.setItem(
        'spa_redirect',
        route + window.location.search + window.location.hash
      );
      window.location.replace('/');
    })();
  </script>
</head>
<body></body>
</html>
